# Parinaam — self-hosted backend stack (REST API + camera engine).
#
# The database is NOT in this file. Parinaam runs against the Supabase-hosted
# PostgreSQL named by DATABASE_URL in .env, which is the single shared ledger
# also read by `parinaam-web`. Both applications therefore see the same
# records; there is no second, local database.
#
#   docker compose up -d server  # the API
#   docker compose run --rm seed # only to rebuild an EMPTY database (idempotent)
#
# Every knob is overridable via .env (see .env.example):
#   DATABASE_URL    Supabase PostgreSQL DSN — REQUIRED, the single source of truth
#   API_PORT        host port for the API       (default 8571)
#   API_BIND        host interface for the API  (default 127.0.0.1; 0.0.0.0 to expose on LAN)
#   ENGINE_PORT     host port for the camera engine (default 8572)
#   ENGINE_BIND     host interface for the camera engine (default 127.0.0.1)
# All container ports are fixed internally; only the host-side mapping is configurable.

services:
  # -------------------------------------------------------------- REST API (server runtime)
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PARINAAM_DB: postgres
      # The single source of truth is DATABASE_URL in .env — the Supabase-hosted
      # PostgreSQL shared with parinaam-web. This must NOT be rebuilt from the
      # POSTGRES_* vars: doing so silently repoints the API at the local `db`
      # container and splits the ledger into two divergent databases.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env to the Supabase connection string}
      # Demo officers seeded on first boot.
      PARINAAM_SEED_PASSWORD: ${PARINAAM_SEED_PASSWORD:-Parinaam#2026}
      # Explicit bootstrap admin password (min 16 chars).
      PARINAAM_API_ADMIN_PASSWORD: ${PARINAAM_API_ADMIN_PASSWORD:-}
      # Internal listen port is fixed; the host mapping below is what you change.
      PARINAAM_API_PORT: 8571
      # Explicit opt-in: load the realistic demo dataset when the database is empty (0 = clean ledger).
      PARINAAM_SEED: ${PARINAAM_SEED:-0}
      PARINAAM_CORS_ORIGINS: ${PARINAAM_CORS_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081,http://192.168.0.102:8081,*}
      PARINAAM_TRUST_PROXY: ${PARINAAM_TRUST_PROXY:-false}
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8571}:8571"
    volumes:
      - ./server:/app/server
      - ./src/contracts:/app/src/contracts
      - ./src/crypto:/app/src/crypto
      - ./src/demo:/app/src/demo
      - ./src/types:/app/src/types
    # Explicit so the service is correct even if pointed at an older image.
    command: ["node", "--experimental-strip-types", "server/src/main.ts"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8571/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [parinaam]

  # -------------------------------------------------------------- camera-engine image service
  # Runs only the reviewed Python/OpenCV image path in its own image. It has no DB,
  # no API credentials, no runtime downloads, and never writes a result to disk.
  camera-engine:
    image: parinaam-camera-engine:local
    build:
      context: ./camera-engine
      dockerfile: service/Dockerfile
    restart: unless-stopped
    environment:
      CAMERA_ENGINE_GEOMETRY: /app/config/card_v1_geometry.yaml
      # Keep 0 in production. Set 1 only for the explicitly labelled printed-mock SIH demo.
      CAMERA_ENGINE_DEMO_MODE: ${CAMERA_ENGINE_DEMO_MODE:-0}
      ENGINE_PORT: 8572
    ports:
      - "${ENGINE_BIND:-127.0.0.1}:${ENGINE_PORT:-8572}:8572"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
          pids: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8572/readyz', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [parinaam]

  # -------------------------------------------------------------- camera-engine unit tests
  camera-engine-test:
    image: parinaam-camera-engine:local
    build:
      context: ./camera-engine
      dockerfile: service/Dockerfile
    profiles: ["test"]
    environment:
      CAMERA_ENGINE_GEOMETRY: /app/config/card_v1_geometry.yaml
      CAMERA_ENGINE_DEMO_MODE: ${CAMERA_ENGINE_DEMO_MODE:-0}
    command: ["python", "-m", "unittest", "discover", "-s", "/app/service", "-p", "test_*.py"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks: [parinaam]

  # -------------------------------------------------------------- demo data seed (one-shot)
  # NOTE: Supabase is already seeded, so this is not part of the normal start
  # path. It is retained for rebuilding an empty database from scratch and now
  # targets the SAME Supabase DATABASE_URL as the API.
  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    profiles: ["seed"]
    environment:
      NODE_ENV: production
      PARINAAM_DB: postgres
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env to the Supabase connection string}
      PARINAAM_SEED_PASSWORD: ${PARINAAM_SEED_PASSWORD:-Parinaam#2026}
    command: ["node", "--experimental-strip-types", "server/src/seed.ts"]
    restart: "no"
    # No host port: an init-style job, run on demand (`docker compose run --rm seed`).
    networks: [parinaam]

  # -------------------------------------------------------------- test runner (on demand)
  # Runs the node:test suite once and exits; no host port is published (the suite
  # boots its own ephemeral API on a random loopback port inside the container).
  #   docker compose run --rm test
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    profiles: ["test"]
    environment:
      NODE_ENV: development
      EXPO_OFFLINE: 1
      CI: 1
    command: ["npm", "test"]
    restart: "no"
    networks: [parinaam]

networks:
  parinaam: {}

