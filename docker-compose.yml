# Parinaam — self-hosted backend stack (PostgreSQL 15 + REST API).
#
#   docker compose up -d db      # just the database, mapped to 127.0.0.1:55433
#   docker compose up -d server  # database + API (waits for db health)
#   docker compose run --rm seed # load the realistic demo dataset (idempotent)
#
# Every knob is overridable via .env (see .env.example):
#   POSTGRES_PORT   host port for the DB        (default 55433, loopback-only)
#   API_PORT        host port for the API       (default 8571)
#   API_BIND        host interface for the API  (default 127.0.0.1; 0.0.0.0 to expose on LAN)
#   ENGINE_PORT     host port for the camera engine (default 8572)
#   ENGINE_BIND     host interface for the camera engine (default 127.0.0.1)
# All container ports are fixed internally; only the host-side mapping is configurable.

services:
  # -------------------------------------------------------------- PostgreSQL 15
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parinaam}
      POSTGRES_USER: ${POSTGRES_USER:-parinaam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parinaam}
      # Deterministic collation so case_ref ordering matches the host tooling.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    # Loopback-only by default: the DB is never exposed to the LAN unless the
    # operator explicitly changes POSTGRES_BIND. The API reaches it over the
    # compose network by service name, so host exposure is only for psql/tooling.
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-55433}:5432"
    volumes:
      - parinaam_pgdata_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parinaam} -d ${POSTGRES_DB:-parinaam}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [parinaam]

  # -------------------------------------------------------------- REST API (server runtime)
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PARINAAM_DB: postgres
      # In-network DSN: service name `db`, internal port 5432.
      DATABASE_URL: postgres://${POSTGRES_USER:-parinaam}:${POSTGRES_PASSWORD:-parinaam}@db:5432/${POSTGRES_DB:-parinaam}
      # Demo officer seeded on first boot.
      PARINAAM_API_ADMIN_PASSWORD: ${PARINAAM_API_ADMIN_PASSWORD:-parinaam-admin-2026}
      # Internal listen port is fixed; the host mapping below is what you change.
      PARINAAM_API_PORT: 8571
      # Opt-in: load the realistic demo dataset when the database is empty.
      PARINAAM_SEED: ${PARINAAM_SEED:-1}
      PARINAAM_CORS_ORIGINS: ${PARINAAM_CORS_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081,http://192.168.0.102:8081,*}
      PARINAAM_TRUST_PROXY: ${PARINAAM_TRUST_PROXY:-false}
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8571}:8571"
    # Explicit so the service is correct even if pointed at an older image.
    command: ["node", "--experimental-strip-types", "server/src/main.ts"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8571/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [parinaam]

  # -------------------------------------------------------------- camera-engine image service
  # Runs only the reviewed Python/OpenCV image path in its own image. It has no DB,
  # no API credentials, no runtime downloads, and never writes a result to disk.
  camera-engine:
    image: parinaam-camera-engine:local
    build:
      context: ./camera-engine
      dockerfile: service/Dockerfile
    restart: unless-stopped
    environment:
      CAMERA_ENGINE_GEOMETRY: /app/config/card_v1_geometry.yaml
      # Keep 0 in production. Set 1 only for the explicitly labelled printed-mock SIH demo.
      CAMERA_ENGINE_DEMO_MODE: ${CAMERA_ENGINE_DEMO_MODE:-0}
      ENGINE_PORT: 8572
    ports:
      - "${ENGINE_BIND:-127.0.0.1}:${ENGINE_PORT:-8572}:8572"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
          pids: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8572/readyz', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [parinaam]

  # -------------------------------------------------------------- camera-engine unit tests
  camera-engine-test:
    image: parinaam-camera-engine:local
    build:
      context: ./camera-engine
      dockerfile: service/Dockerfile
    profiles: ["test"]
    environment:
      CAMERA_ENGINE_GEOMETRY: /app/config/card_v1_geometry.yaml
      CAMERA_ENGINE_DEMO_MODE: ${CAMERA_ENGINE_DEMO_MODE:-0}
    command: ["python", "-m", "unittest", "discover", "-s", "/app/service", "-p", "test_*.py"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks: [parinaam]

  # -------------------------------------------------------------- demo data seed (one-shot)
  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PARINAAM_DB: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-parinaam}:${POSTGRES_PASSWORD:-parinaam}@db:5432/${POSTGRES_DB:-parinaam}
      PARINAAM_API_ADMIN_PASSWORD: ${PARINAAM_API_ADMIN_PASSWORD:-parinaam-admin-2026}
    command: ["node", "--experimental-strip-types", "server/src/seed.ts"]
    restart: "no"
    # No host port: an init-style job, run on demand (`docker compose run --rm seed`).
    networks: [parinaam]

  # -------------------------------------------------------------- test runner (on demand)
  # Runs the node:test suite once and exits; no host port is published (the suite
  # boots its own ephemeral API on a random loopback port inside the container).
  #   docker compose run --rm test
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    profiles: ["test"]
    environment:
      NODE_ENV: development
      EXPO_OFFLINE: 1
      CI: 1
    command: ["npm", "test"]
    restart: "no"
    networks: [parinaam]

networks:
  parinaam: {}

volumes:
  # Project-scoped and versioned so it can never reuse the retired v1 demo volume.
  parinaam_pgdata_v2:
