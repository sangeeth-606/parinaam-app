# Parinaam reference card v1 - finalized geometry (mm, origin = top-left of card)
card_width_mm: 100
card_height_mm: 80

fiducial_layout:
  - id: 0
    corner: TL
    dict: DICT_4X4_50
    x_mm: 6
    y_mm: 7
    size_mm: 10
  - id: 1
    corner: TR
    dict: DICT_4X4_50
    x_mm: 84
    y_mm: 7
    size_mm: 10
  - id: 2
    corner: BL
    dict: DICT_4X4_50
    x_mm: 6
    y_mm: 63
    size_mm: 10
  - id: 3
    corner: BR
    dict: DICT_4X4_50
    x_mm: 84
    y_mm: 63
    size_mm: 10

data_matrix:
  x_mm: 30
  y_mm: 64
  size_mm: 8
  encodes: "PARINAAM|CARD_V1|ID:0001|BATCH:0001"

card_label_text_row:
  y_range_mm: [75, 79.5]
  text: "PARINAAM CARD \u00b7 v1 \u00b7 ID: 0001 \u00b7 BATCH: 0001"

patch_layout:
  - patch_id: "P01"
    family: achromatic
    design_rect: {x_mm: 23, y_mm: 6, width_mm: 12, height_mm: 12}
    print_target_hex: "#F0F0F0"
    reference_lab: {L: 96.5, a: -0.6, b: -1.8}  # SCANNER-DERIVED (avg of 2 different flatbed scanners; inter-scan dE76=4.5 -- NOT spectrophotometer-grade, treat as +/-5 dE uncertainty)
  - patch_id: "P02"
    family: achromatic
    design_rect: {x_mm: 37, y_mm: 6, width_mm: 12, height_mm: 12}
    print_target_hex: "#C8C8C8"
    reference_lab: {L: 85.5, a: -0.9, b: -5.5}  # SCANNER-DERIVED (avg of 2 different flatbed scanners; inter-scan dE76=4.2 -- NOT spectrophotometer-grade, treat as +/-4 dE uncertainty)
  - patch_id: "P03"
    family: achromatic
    design_rect: {x_mm: 51, y_mm: 6, width_mm: 12, height_mm: 12}
    print_target_hex: "#9E9E9E"
    reference_lab: {L: 70.8, a: -2.2, b: -9.8}  # SCANNER-DERIVED (avg of 2 different flatbed scanners; inter-scan dE76=4.6 -- NOT spectrophotometer-grade, treat as +/-5 dE uncertainty)
  - patch_id: "P04"
    family: achromatic
    design_rect: {x_mm: 65, y_mm: 6, width_mm: 12, height_mm: 12}
    print_target_hex: "#777777"
    reference_lab: {L: 56.1, a: -1.6, b: -12.1}  # SCANNER-DERIVED (avg of 2 different flatbed scanners; inter-scan dE76=5.4 -- NOT spectrophotometer-grade, treat as +/-5 dE uncertainty)
  - patch_id: "P05"
    family: achromatic
    design_rect: {x_mm: 23, y_mm: 20, width_mm: 12, height_mm: 12}
    print_target_hex: "#4D4D4D"
    reference_lab: {L: 39.5, a: 1.5, b: -15.3}  # SCANNER-DERIVED (avg of 2 different flatbed scanners; inter-scan dE76=7.9 -- NOT spectrophotometer-grade, treat as +/-8 dE uncertainty)
  - patch_id: "P06"
    family: achromatic
    design_rect: {x_mm: 37, y_mm: 20, width_mm: 12, height_mm: 12}
    print_target_hex: "#262626"
    reference_lab: {L: 22.7, a: 4.9, b: -9.2}  # SCANNER-DERIVED (avg of 2 different flatbed scanners; inter-scan dE76=9.6 -- NOT spectrophotometer-grade, treat as +/-10 dE uncertainty)
  - patch_id: "P07"
    family: chromatic
    design_rect: {x_mm: 51, y_mm: 20, width_mm: 12, height_mm: 12}
    print_target_hex: "#E30613"
    reference_lab: {L: 49.3, a: 67.5, b: 39.7}  # SCANNER-DERIVED (avg of 2 different flatbed scanners; inter-scan dE76=11.0 -- NOT spectrophotometer-grade, treat as +/-11 dE uncertainty)
  - patch_id: "P08"
    family: chromatic
    design_rect: {x_mm: 65, y_mm: 20, width_mm: 12, height_mm: 12}
    print_target_hex: "#009640"
    reference_lab: {L: 53.6, a: -44.2, b: 17.3}  # SCANNER-DERIVED (single scanner reading only - second scan missing for this patch, lower confidence)
  - patch_id: "P09"
    family: chromatic
    design_rect: {x_mm: 23, y_mm: 34, width_mm: 12, height_mm: 12}
    print_target_hex: "#004B93"
    reference_lab: {L: 46.3, a: -10.3, b: -40.7}  # SCANNER-DERIVED (avg of 2 different flatbed scanners; inter-scan dE76=13.1 -- NOT spectrophotometer-grade, treat as +/-13 dE uncertainty)
  - patch_id: "P10"
    family: chromatic
    design_rect: {x_mm: 37, y_mm: 34, width_mm: 12, height_mm: 12}
    print_target_hex: "#00A9E0"
    reference_lab: {L: 65.2, a: -22.6, b: -39.2}  # SCANNER-DERIVED (avg of 2 different flatbed scanners; inter-scan dE76=13.6 -- NOT spectrophotometer-grade, treat as +/-14 dE uncertainty)
  - patch_id: "P11"
    family: chromatic
    design_rect: {x_mm: 51, y_mm: 34, width_mm: 12, height_mm: 12}
    print_target_hex: "#E5007D"
    reference_lab: {L: 48.1, a: 69.9, b: -7.5}  # SCANNER-DERIVED (avg of 2 different flatbed scanners; inter-scan dE76=10.0 -- NOT spectrophotometer-grade, treat as +/-10 dE uncertainty)
  - patch_id: "P12"
    family: chromatic
    design_rect: {x_mm: 65, y_mm: 34, width_mm: 12, height_mm: 12}
    print_target_hex: "#FFD500"
    reference_lab: {L: 84.3, a: 2.1, b: 68.8}  # SCANNER-DERIVED (avg of 2 different flatbed scanners; inter-scan dE76=9.3 -- NOT spectrophotometer-grade, treat as +/-9 dE uncertainty)
  - patch_id: "P13"
    family: reagent_adjacent
    design_rect: {x_mm: 23, y_mm: 48, width_mm: 12, height_mm: 12}
    print_target_hex: "#6B2C91"
    reference_lab: {L: 41.9, a: 24.5, b: -38.7}  # SCANNER-DERIVED (avg of 2 different flatbed scanners; inter-scan dE76=12.6 -- NOT spectrophotometer-grade, treat as +/-13 dE uncertainty)
  - patch_id: "P14"
    family: reagent_adjacent
    design_rect: {x_mm: 37, y_mm: 48, width_mm: 12, height_mm: 12}
    print_target_hex: "#1B3B6F"
    reference_lab: {L: 37.4, a: -5.8, b: -38.5}  # SCANNER-DERIVED (avg of 2 different flatbed scanners; inter-scan dE76=7.0 -- NOT spectrophotometer-grade, treat as +/-7 dE uncertainty)
  - patch_id: "P15"
    family: reagent_adjacent
    design_rect: {x_mm: 51, y_mm: 48, width_mm: 12, height_mm: 12}
    print_target_hex: "#158A82"
    reference_lab: {L: 55.5, a: -28.5, b: -20.4}  # SCANNER-DERIVED (avg of 2 different flatbed scanners; inter-scan dE76=5.8 -- NOT spectrophotometer-grade, treat as +/-6 dE uncertainty)
  - patch_id: "P16"
    family: reagent_adjacent
    design_rect: {x_mm: 65, y_mm: 48, width_mm: 12, height_mm: 12}
    print_target_hex: "#B5651D"
    reference_lab: {L: 56.1, a: 24.2, b: 45.7}  # SCANNER-DERIVED (avg of 2 different flatbed scanners; inter-scan dE76=17.8 -- NOT spectrophotometer-grade, treat as +/-18 dE uncertainty)

mvp_test1_kit_profile:
  kit_profile_id: "mvp_test1_mock_cannabinoid"
  test_name: "Marijuana/Hashish presumptive (Duquenois-Levine family) - MOCK for MVP demo, not a real chemical test"
  test_type: "PRINTED_PATCH_MOCK"
  status: "PENDING_VALIDATION"  # must never be presented as a validated chemical result
  test_geometry:
    locator_method: "HOMOGRAPHY_OFFSET"
    # The external demo swatch is placed beside the card in the phone-photo
    # fixtures. Its active ROI is empirically matched to the printed layout at
    # x=149..161 mm, y=31..43 mm (the earlier x=105/y=34 text was a stale
    # placeholder and is not used by this service).
    roi_card_relative: {x_mm: 149, y_mm: 31, width_mm: 12, height_mm: 12}
  expected_result_colors:
    # DEMO CONFIGURATION: outcomes are mapped to physical cutout swatches taken from a second
    # printed copy of this same reference card (patches P13 and P14). This reuses ink whose
    # Lab values are already scanner-measured, instead of printing and measuring new swatches.
    # NOTE ON WHAT THIS DOES AND DOESN'T DEMONSTRATE: P13/P14 are also part of the 16-patch set
    # used to FIT the calibration, so the correction is partly optimised to land on these very
    # colours. A correct classification here demonstrates that the pipeline discriminates two
    # colours and abstains on a third - it does NOT independently validate classification
    # accuracy on colours the calibration never saw.
    - outcome_label: "POSITIVE_CANNABINOID"
      print_target_hex: "#6B2C91"  # card patch P13 (violet) - cutout used as the mock POSITIVE swatch
      reference_lab: {L: 41.9, a: 24.5, b: -38.7}  # SCANNER-DERIVED, same provenance as patch_layout P13
      tolerance_radius_de00: 10.0  # Increased to 10.0 per user instruction for testing
      source: "Cutout of card patch P13 from a second printed card - mock demo target, not reagent chemistry"
    - outcome_label: "NEGATIVE"
      print_target_hex: "#1B3B6F"  # card patch P14 (navy) - cutout used as the mock NEGATIVE swatch
      reference_lab: {L: 37.4, a: -5.8, b: -38.5}  # SCANNER-DERIVED, same provenance as patch_layout P14
      tolerance_radius_de00: 10.0
      source: "Cutout of card patch P14 from a second printed card - mock demo target, not reagent chemistry"
  abstention_demo_swatch:
    # NOT an outcome - deliberately matches neither target, to demo correct INCONCLUSIVE behaviour.
    # Use a cutout of card patch P05 (very dark grey): 11.0 dE00 from P13, 14.6 dE00 from P14,
    # so it exceeds both 8.0 tolerances and must return INCONCLUSIVE / NO_CLOSE_MATCH.
    suggested_patch: "P05"
    expected_result: "INCONCLUSIVE (NO_CLOSE_MATCH)"
  validity_rules:
    kit_expiry_check: false
    batch_specific: false
    min_confidence_to_classify: 0.4  # initial engineering default, not yet tuned
  model_version: "mvp-v1-demo-p13p14"


