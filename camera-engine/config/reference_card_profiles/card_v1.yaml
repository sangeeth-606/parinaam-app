source: "MVP placeholder, not spectrophotometrically validated"

card_dimensions_mm:
  width: 100.0
  height: 70.0

# ArUco: DICT_4X4_50, 8x8mm markers
# Positions = top-left corner of marker in card-local mm (origin=card TL, x=right, y=down)
fiducial_layout:
  - fiducial_id: "ArUco_TL"
    aruco_dict: "DICT_4X4_50"
    aruco_marker_id: 0
    position_mm: {x: 2.0, y: 2.0}
    size_mm: 8.0
  - fiducial_id: "ArUco_TR"
    aruco_dict: "DICT_4X4_50"
    aruco_marker_id: 1
    position_mm: {x: 90.0, y: 2.0}
    size_mm: 8.0
  - fiducial_id: "ArUco_BL"
    aruco_dict: "DICT_4X4_50"
    aruco_marker_id: 2
    position_mm: {x: 2.0, y: 57.0}
    size_mm: 8.0
  - fiducial_id: "ArUco_BR"
    aruco_dict: "DICT_4X4_50"
    aruco_marker_id: 3
    position_mm: {x: 90.0, y: 57.0}
    size_mm: 8.0

data_matrix:
  position_mm: {x: 68.0, y: 57.0}
  size_mm: {width: 20.0, height: 8.0}
  encodes: "reference_card_id|reference_card_version|manufacturing_batch"

